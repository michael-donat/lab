apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gaming
nameSuffix: -y2026
resources:
  - ../base-server

labels:
  - pairs:
      name: minecraft-server-2026
    includeSelectors: true
    includeTemplates: true

commonAnnotations:
  "mc-router.itzg.me/externalServerName": "2026.ms.lab.donat.im"

configMapGenerator:
  - name: extras
    files:
      - minecraft.mods.txt
  - name: minecraft-world-config
    literals:
      #- TYPE=FORGE
      - REMOVE_OLD_MODS=TRUE
      - MODE=survival
      - MOTD=The Donat's 2026
      - SERVER_NAME=The Donat's 2026
      - SEED=75794298
      - MODS_FILE=/extras/minecraft.mods.txt
      - EULA=TRUE
      - JVM_XX_OPTS="-XX:MaxRAMPercentage=80"
      - OVERRIDE_SERVER_PROPERTIES="true"
      - SPAWN_PROTECTION="0"
      - MAX_TICK_TIME=-1
      - ENABLE_AUTOPAUSE=TRUE
      - GUI=FALSE
      - VERSION=26.1
      - OPS=6f773c39-9910-4cf7-aaeb-7d50cfa21d0e,dc0ed078-8692-4fc0-9bb7-37fdc620dc8d

patches:
  - target:
      kind: Deployment
      name: minecraft-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minecraft-server
      spec:
        template:
          spec:
            volumes:
              - hostPath:
                  path: /kubernetes-volumes/minecraft-storage/2026
                name: minecraft-storage
