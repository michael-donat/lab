apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gaming
nameSuffix: -xmas2025
resources:
  - ../base-server

commonLabels:
  name: minecraft-server-q42025

commonAnnotations:
  "mc-router.itzg.me/externalServerName": "xmas2025.ms.lab.donat.im"

configMapGenerator:
  - name: extras
    files:
      - minecraft.mods.txt
  - name: minecraft-world-config
    literals:
      #- TYPE=FORGE
      - REMOVE_OLD_MODS=TRUE
      - MODE=survival
      - MOTD=Survival - 1.21.11 - Xmas 2025
      - SERVER_NAME=Survival 1.21.11 - Xmas 2025
      - VERSION=1.21.11

patches:
  - target:
      kind: Deployment
      name: minecraft-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minecraft-server
      spec:
        template:
          spec:
            volumes:
              - hostPath:
                  path: /kubernetes-volumes/minecraft-storage/xmas2025
                name: minecraft-storage
