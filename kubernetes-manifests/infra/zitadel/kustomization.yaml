apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra

# Rendered from zitadel/zitadel helm chart v10.0.2 (app v4.14.0).
# The post-delete cleanup Job is intentionally omitted (it would otherwise
# run at apply time and delete the setup-generated secrets).
# Regenerate with:
#   helm repo add zitadel https://charts.zitadel.com
#   helm repo update zitadel
#   helm template zitadel zitadel/zitadel --version 10.0.2 \
#     --namespace infra --values values.yaml --output-dir manifests
#   # then copy non-empty templates (excluding job_cleanup.yaml) into rendered/
resources:
  - rendered/serviceaccount_zitadel.yaml
  - rendered/secret_zitadel-masterkey.yaml
  - rendered/secret_zitadel-secrets.yaml
  - rendered/configmap_zitadel.yaml
  - rendered/rbac_zitadel.yaml
  - rendered/service_zitadel.yaml
  - rendered/ingress_zitadel.yaml
  - rendered/job_init.yaml
  - rendered/job_setup.yaml
  - rendered/deployment_zitadel.yaml
  # Login V2 component (zitadel v4 console redirects to /ui/v2/login)
  - rendered/serviceaccount_login.yaml
  - rendered/secret_login-service-key.yaml
  - rendered/configmap_login.yaml
  - rendered/service_login.yaml
  - rendered/deployment_login.yaml
  - rendered/ingress_login.yaml
