# ~/.tmux.conf  (managed in dotfiles, symlinked to ~/.tmux.conf)
#
# Mostly for the "plain attach" case (ssh in from a phone or a non-iTerm
# terminal). When you attach from iTerm with `tmux -CC`, iTerm draws its own
# tabs/panes/scrollback and ignores most of the visual settings below.

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# 1-based windows/panes, and keep numbers tidy when you close one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Snappier prefix, and let programs know when a pane gains focus.
set -sg escape-time 10
set -g focus-events on

# Truecolour for plain attaches.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Ctrl-b r reloads this file.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
